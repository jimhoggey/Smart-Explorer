name: build
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m pytest -q
      - run: pyinstaller smart_explorer.spec
      - name: Headless smoke test
        shell: bash
        env:
          SMART_EXPLORER_HEADLESS: "1"
          SMART_EXPLORER_PORT: "8765"
        run: |
          dist/SmartExplorer/SmartExplorer* &
          sleep 10
          curl -sf http://127.0.0.1:8765/api/status
      - run: python -c "import shutil; shutil.make_archive('SmartExplorer-${{ runner.os }}', 'zip', 'dist', 'SmartExplorer')"
      - uses: actions/upload-artifact@v4
        with:
          name: SmartExplorer-${{ runner.os }}
          path: SmartExplorer-*.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: SmartExplorer-*.zip
